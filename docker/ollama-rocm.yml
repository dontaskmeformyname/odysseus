# Ollama with AMD ROCm GPU support.
#
# Adds a local Ollama service to the Odysseus stack, running entirely in
# Docker with GPU passthrough. Odysseus auto-discovers it at
# http://ollama:11434/v1 on the shared Docker network.
#
# Enable in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.amd.yml:docker/ollama-rocm.yml
#   RENDER_GID=<numeric output of: getent group render | cut -d: -f3>
#   HSA_OVERRIDE_GFX_VERSION=10.3.0   # RX 6900 XT (gfx1030)
#
# The host needs only the amdgpu kernel driver (kfd + DRI devices) and
# the user in the video/render groups. No ROCm userspace install required.
#
# Pull models after startup:
#   docker compose exec ollama ollama pull qwen3:14b
#
# Or use the Odysseus Cookbook UI to browse and serve models.

services:
  odysseus:
    environment:
      # Point Odysseus at the bundled Ollama container.
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      # Embeddings via Ollama too (all-minilm is small and fast).
      - EMBEDDING_URL=http://ollama:11434/v1/embeddings
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: docker.io/ollama/ollama:rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}
    environment:
      # Passthrough: only set when defined in .env or host environment.
      - HSA_OVERRIDE_GFX_VERSION
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

volumes:
  ollama-data:
